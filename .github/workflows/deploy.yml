name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly, so prices stay reasonably fresh even without a code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # Card *identity* (name/mana cost/colors/type/oracle text/set/rarity/
      # image) rarely changes, so we cache it across CI runs keyed on the
      # source lists' contents. Price is never cached (see resolve.py) and
      # is always re-fetched from Scryfall below, so this only saves the
      # identity-lookup network calls, not price freshness.
      - uses: actions/cache@v4
        with:
          path: cache/card-data.json
          key: card-data-${{ hashFiles('bulk.txt', 'decks/**/*.txt', 'collections/**/*.txt') }}
          restore-keys: |
            card-data-

      - name: Build card data
        run: python3 scripts/build/build.py

      - name: Build static site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
